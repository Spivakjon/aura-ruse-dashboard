<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA RUSE — לוח בקרה</title>
<script>if(sessionStorage.getItem('aura_auth')!=='1')window.location.href='index.html';</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap');
:root{--bg:#0b1120;--card:#151d2e;--card2:#1a2332;--border:#243044;--cyan:#22d3ee;--green:#34d399;--gold:#fbbf24;--red:#f87171;--text:#e2e8f0;--dim:#94a3b8;--muted:#64748b;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Top bar ── */
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:100;height:56px}
.topbar .logo{font-size:20px;font-weight:900;background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px;white-space:nowrap}
.topbar .logo span{font-size:12px;font-weight:400;-webkit-text-fill-color:var(--muted);margin-right:8px}
.nav{display:flex;gap:4px;margin-right:auto}
.nav-btn{background:none;border:none;padding:10px 18px;color:var(--dim);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;transition:.15s;position:relative;display:flex;align-items:center;gap:6px}
.nav-btn:hover{color:var(--text);background:rgba(255,255,255,.03)}
.nav-btn.active{color:var(--cyan);background:rgba(34,211,238,.06)}
.nav-btn.active::after{content:'';position:absolute;bottom:-1px;left:10%;right:10%;height:2px;background:var(--cyan);border-radius:2px}
.nav-btn .badge{font-size:9px;background:var(--cyan);color:var(--bg);padding:1px 6px;border-radius:8px;font-weight:700}
.topbar .logout{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px}
.topbar .logout:hover{border-color:var(--red);color:var(--red)}

/* ── Pages ── */
.page{display:none;padding:20px 24px;max-width:1500px;margin:0 auto}
.page.active{display:block}

/* ── Simulator ── */
.sim-grid{display:grid;grid-template-columns:300px 1fr;gap:16px}
.controls{display:flex;flex-direction:column;gap:10px}
.ctrl{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;transition:.15s}
.ctrl:hover{border-color:rgba(34,211,238,.2)}
.ctrl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ctrl-head label{font-size:12px;color:var(--dim);font-weight:500}
.ctrl-head .val{font-size:18px;font-weight:800;color:var(--cyan)}
.ctrl input[type=range]{width:100%;accent-color:var(--cyan);cursor:pointer;height:6px}
.ctrl select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:13px;cursor:pointer}
.hold-box{background:rgba(251,191,36,.04);border-color:rgba(251,191,36,.2)!important}
.hold-box .val{color:var(--gold)!important}
.section-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:6px 4px 2px}

/* ── Cards ── */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;transition:.15s}
.card:hover{border-color:rgba(34,211,238,.15)}
.card .lbl{font-size:11px;color:var(--muted);margin-bottom:4px}
.card .num{font-size:24px;font-weight:800;line-height:1.2}
.card .sub{font-size:10px;color:var(--dim);margin-top:4px}

/* ── Chart ── */
.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-height:300px;position:relative;margin-bottom:12px}
.chart-title{font-size:14px;font-weight:700;color:var(--dim);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-left:4px;vertical-align:middle}

/* ── Tables ── */
.tables{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tbl{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.tbl h4{font-size:14px;font-weight:700;margin-bottom:8px}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;padding:7px 8px;color:var(--muted);font-weight:500;font-size:10px;border-bottom:1px solid var(--border);background:rgba(34,211,238,.04)}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.03)}
.tbl .n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.tbl .tot td{background:rgba(52,211,153,.05);font-weight:700}
.tbl .foot{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.6}

/* ── Docs ── */
.doc-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.doc-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;cursor:pointer;font-family:inherit;transition:.15s;text-align:right}
.doc-btn:hover{border-color:rgba(34,211,238,.3)}
.doc-btn.active{border-color:var(--cyan);background:rgba(34,211,238,.06)}
.doc-btn .dt-name{font-size:13px;font-weight:700;color:var(--text)}
.doc-btn .dt-desc{font-size:10px;color:var(--dim);margin-top:2px}
.doc-btn.active .dt-name{color:var(--cyan)}
.doc-viewer-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.doc-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border)}
.doc-bar .title{font-size:13px;font-weight:600}
.doc-bar .actions{display:flex;gap:6px}
.doc-bar .actions a{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;text-decoration:none;border:1px solid var(--border)}
.doc-bar .actions a:first-child{color:var(--cyan);border-color:rgba(34,211,238,.3)}
.doc-bar .actions a:last-child{color:var(--green);border-color:rgba(52,211,153,.3)}

/* ── AI Chat ── */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 96px)}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-msg{max-width:80%;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.8;white-space:pre-wrap}
.chat-msg.user{background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.15);align-self:flex-end}
.chat-msg.ai{background:var(--card);border:1px solid var(--border);align-self:flex-start}
.chat-msg.system{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.12);align-self:center;color:var(--gold);font-size:12px;text-align:center;max-width:100%}
.chat-bottom{padding:12px 16px;background:var(--card);border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end}
.chat-bottom textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:14px;resize:none;outline:none;min-height:48px;max-height:150px;line-height:1.5}
.chat-bottom textarea:focus{border-color:var(--cyan)}
.chat-bottom button{background:linear-gradient(135deg,var(--cyan),var(--green));border:none;border-radius:12px;padding:12px 22px;color:var(--bg);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s}
.chat-bottom button:hover{opacity:.9}
.chat-bottom button:disabled{opacity:.3}
.api-banner{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;max-width:400px;margin:40px auto}
.api-banner input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:14px;margin:10px 0;text-align:center;direction:ltr}
.api-banner button{padding:10px 24px;background:linear-gradient(135deg,var(--cyan),var(--green));border:none;border-radius:8px;color:var(--bg);font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
.chat-typing{color:var(--muted);font-size:13px;padding:8px 16px;font-style:italic}

/* ── Tablet ── */
@media(max-width:1100px){
  .sim-grid{grid-template-columns:260px 1fr}
  .cards{grid-template-columns:repeat(2,1fr)}
}

/* ── Mobile ── */
@media(max-width:768px){
  .topbar{height:auto;flex-wrap:wrap;padding:8px 12px;gap:6px}
  .topbar .logo{font-size:16px;width:100%;text-align:center;padding-bottom:4px}
  .topbar .logo span{display:block;margin:0}
  .nav{width:100%;justify-content:center;gap:2px}
  .nav-btn{padding:8px 10px;font-size:12px;flex:1;justify-content:center;border-radius:8px 8px 0 0}
  .topbar .logout{position:absolute;top:8px;left:8px;padding:4px 8px;font-size:10px}
  .page{padding:10px 8px}

  /* Simulator mobile */
  .sim-grid{grid-template-columns:1fr;gap:10px}
  .controls{order:2}
  .cards{grid-template-columns:repeat(2,1fr);gap:6px}
  .card{padding:10px}
  .card .num{font-size:18px}
  .card .lbl{font-size:9px}
  .card .sub{font-size:8px}
  .chart-wrap{min-height:220px;padding:10px}
  .tables{grid-template-columns:1fr;gap:8px}
  .tbl{padding:10px}
  .tbl table{font-size:11px}
  .tbl th,.tbl td{padding:5px 6px}
  .ctrl{padding:10px}
  .ctrl-head label{font-size:11px}
  .ctrl-head .val{font-size:16px}
  .section-label{font-size:10px;padding:4px 2px 0}

  /* Docs mobile */
  .doc-tabs{gap:4px}
  .doc-btn{padding:8px 10px;min-width:0;flex:1}
  .doc-btn .dt-name{font-size:11px}
  .doc-btn .dt-desc{font-size:9px}
  .doc-viewer-wrap iframe{height:60vh}
  .doc-bar{flex-wrap:wrap;gap:6px;padding:8px 10px}
  .doc-bar .title{font-size:11px;width:100%}
  .doc-bar .actions a{padding:4px 10px;font-size:10px}

  /* Chat mobile */
  .chat-container{height:calc(100vh - 120px)}
  .chat-msg{max-width:95%;font-size:13px;padding:10px 12px;line-height:1.6}
  .chat-bottom{padding:8px 10px}
  .chat-bottom textarea{font-size:14px;padding:10px 12px}
  .chat-bottom button{padding:10px 16px;font-size:13px}
}

/* ── Small mobile ── */
@media(max-width:400px){
  .cards{grid-template-columns:1fr}
  .card{display:flex;align-items:center;gap:10px;text-align:right;padding:10px 12px}
  .card .lbl{font-size:10px;order:1;flex:1}
  .card .num{font-size:20px;order:2}
  .card .sub{display:none}
}

/* ── Touch improvements ── */
@media(pointer:coarse){
  input[type=range]{height:8px;margin:4px 0}
  input[type=range]::-webkit-slider-thumb{width:24px;height:24px}
  .nav-btn{min-height:44px}
  .doc-btn{min-height:48px}
  .chat-bottom button{min-height:44px}
  select{min-height:44px;font-size:14px}
}
</style>
</head>
<body>

<!-- ── Top Bar ── -->
<div class="topbar">
  <div class="logo">AURA RUSE <span>D+E · 73 דירות</span></div>
  <div class="nav">
    <button class="nav-btn active" onclick="showPage('sim',this)">&#9881; סימולטור</button>
    <button class="nav-btn" onclick="showPage('docs',this)">&#128196; מצגות</button>
    <button class="nav-btn" onclick="showPage('chat',this)">&#129302; יועץ AI</button>
  </div>
  <button class="logout" onclick="sessionStorage.clear();location.href='index.html'">&#8617; יציאה</button>
</div>

<!-- ══════════ PAGE: SIMULATOR ══════════ -->
<div class="page active" id="page-sim">
<div class="sim-grid">
  <div class="controls">
    <div class="section-label">פרמטרי מכירה</div>
    <div class="ctrl">
      <div class="ctrl-head"><label>קצב מכירות</label><div class="val" id="v_pace">3 דירות/חודש</div></div>
      <input type="range" id="pace" min="1" max="8" step="1" value="3">
    </div>
    <div class="ctrl">
      <div class="ctrl-head"><label>תחילת מכירות</label><div class="val" id="v_start">חודש 3</div></div>
      <input type="range" id="start" min="1" max="12" step="1" value="3">
    </div>
    <div class="ctrl">
      <div class="ctrl-head"><label>מחיר מכירה / מ"ר ברוטו</label><div class="val" id="v_price">€1,350</div></div>
      <input type="range" id="price" min="1100" max="1700" step="50" value="1350">
    </div>
    <div class="section-label">פרמטרי עלות</div>
    <div class="ctrl">
      <div class="ctrl-head"><label>עלות בנייה / מ"ר</label><div class="val" id="v_constr">€675</div></div>
      <input type="range" id="constr" min="500" max="900" step="25" value="675">
    </div>
    <div class="section-label">מימון</div>
    <div class="ctrl">
      <div class="ctrl-head"><label>סכום גיוס</label><div class="val" id="v_raise">€3.5M</div></div>
      <input type="range" id="raise" min="2000000" max="5000000" step="100000" value="3500000">
    </div>
    <div class="ctrl">
      <div class="ctrl-head"><label>מודל תשלום</label></div>
      <select id="paymodel">
        <option value="20-40-40">20% מקדמה / 40% Act14 / 40% Act16</option>
        <option value="30-35-35">30% מקדמה / 35% Act14 / 35% Act16</option>
        <option value="10-45-45">10% מקדמה / 45% Act14 / 45% Act16</option>
      </select>
    </div>
    <div class="section-label">תרחיש Hold</div>
    <div class="ctrl hold-box">
      <div class="ctrl-head"><label>מחיר Hold / מ"ר — דירות נותרות</label><div class="val" id="v_holdprice">€1,550</div></div>
      <input type="range" id="holdprice" min="1350" max="2000" step="50" value="1550">
    </div>
  </div>

  <div>
    <div class="cards" id="cards"></div>
    <div class="chart-wrap">
      <div class="chart-title">
        <span>תזרים מצטבר — 30 חודשים</span>
        <div class="legend" style="margin-right:auto">
          <span><i style="background:var(--cyan)"></i> בסיס</span>
          <span><i style="background:var(--gold)"></i> Hold</span>
        </div>
      </div>
      <canvas id="chart"></canvas>
    </div>
    <div class="tables">
      <div class="tbl" id="waterfall"></div>
      <div class="tbl" id="holdResult"></div>
    </div>
  </div>
</div>
</div>

<!-- ══════════ PAGE: DOCS ══════════ -->
<div class="page" id="page-docs">
  <div class="doc-tabs" id="doc-tabs"></div>
  <div class="doc-viewer-wrap">
    <div class="doc-bar">
      <div class="title" id="doc-title"></div>
      <div class="actions">
        <a id="doc-download" href="#" download>&#8681; הורדה</a>
        <a id="doc-newtab" href="#" target="_blank">&#8599; חלון חדש</a>
      </div>
    </div>
    <iframe id="doc-viewer" style="width:100%;height:calc(100vh - 160px);border:none;background:#1a1a2e"></iframe>
  </div>
</div>

<!-- ══════════ PAGE: AI CHAT ══════════ -->
<div class="page" id="page-chat">
  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="chat-msg system">היועץ מחובר לכל נתוני הפרויקט והסימולטור בזמן אמת.<br>שנה פרמטרים בסימולטור ושאל כאן — הוא יענה לפי הנתונים העדכניים.</div>
    </div>
    <div class="chat-bottom" id="chatInputWrap">
      <textarea id="chatInput" placeholder="שאל על הנתונים, בקש חישוב, או תן הוראות למצגת..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,150)+'px'"></textarea>
      <button id="chatSend" onclick="sendChat()">שלח &#8592;</button>
    </div>
  </div>
</div>

<script>
// ══════════ NAVIGATION ══════════
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if(btn) btn.classList.add('active');
  if(id==='sim') setTimeout(compute, 50);
}

// ══════════ SIMULATOR ══════════
const MIX = [
  {type:'1.1',area:77.247,count:15},{type:'2.1',area:52.987,count:15},
  {type:'3.1',area:49.687,count:15},{type:'4.1',area:115.447,count:14},{type:'5.1',area:88.266,count:14}
];
const TOTAL_APTS=73,APTS_D=40,APTS_E=33,PARK=58,PARK_PRICE=35000,COMMON_PCT=15;
const LAND=1270067,ARCH=200000,ELEC=500000,DEMO=500000,CONSTR_AREA=8020,BUILD_MONTHS=24,PM=30;
const NET_AREA=MIX.reduce((s,m)=>s+m.area*m.count,0);
const GROSS_AREA=Math.round(NET_AREA*(1+COMMON_PCT/100));
const fmt=v=>'€'+Math.round(v).toLocaleString('he-IL');
const fmtM=v=>'€'+(v/1e6).toFixed(2)+'M';
const fmtPct=v=>(v*100).toFixed(1)+'%';

const els={};
let _raf=0;
function scheduleCompute(){cancelAnimationFrame(_raf);_raf=requestAnimationFrame(compute);}
['pace','start','price','constr','raise','holdprice','paymodel'].forEach(id=>{
  els[id]=document.getElementById(id);
  els[id].addEventListener(id==='paymodel'?'change':'input',scheduleCompute);
});

function simulate(ss,pace,pps,cps,pp){
  const c=cps*CONSTR_AREA,ar=GROSS_AREA*pps,pr=PARK*PARK_PRICE,tr=ar+pr;
  const uf=ARCH+ELEC+DEMO,tc=LAND+c+uf,profit=tr-tc,aur=tr/TOTAL_APTS;
  const[dp,a14p,a16p]=pp,dep=aur*dp,a14=aur*a14p,a16=aur*a16p,mc=c/BUILD_MONTHS;
  const be=Math.ceil((tc-pr)/(ar/TOTAL_APTS));
  const rows=[];let cum=0,sold=0;
  for(let m=0;m<=PM;m++){
    const out=(m===0?uf:0)+(m<BUILD_MONTHS?mc:0);
    const ns=(m>=ss&&sold<TOTAL_APTS)?Math.min(pace,TOTAL_APTS-sold):0;
    sold+=ns;const sD=Math.min(Math.round(sold*APTS_D/TOTAL_APTS),APTS_D),sE=sold-sD;
    let inf=ns*dep;
    if(m===12)inf+=sD*a14;if(m===18)inf+=sE*a14;if(m===24)inf+=sD*a16;if(m===30)inf+=sE*a16;
    cum+=inf-out;rows.push({m,cum:Math.round(cum),sold});
  }
  const peak=Math.min(...rows.map(r=>r.cum)),peakM=rows.find(r=>r.cum===peak).m;
  const br=rows.find((r,i)=>i>0&&r.cum>=0);
  return{rows,peak,peakM,beM:br?br.m:PM,constr:c,aptRev:ar,parkRev:pr,totalRev:tr,totalCost:tc,profit,avgUnitRev:aur,breakEven:be,upfront:uf,depPct:dp,a14Pct:a14p,a16Pct:a16p};
}

function simulateHold(b,hp){
  const be=Math.min(b.breakEven,TOTAL_APTS),sl=TOTAL_APTS-be,gpa=GROSS_AREA/TOTAL_APTS;
  const fr=be*gpa*b.aptRev/GROSS_AREA+be*(b.parkRev/TOTAL_APTS);
  const lr=sl*gpa*hp+sl*(b.parkRev/TOTAL_APTS);
  return{sellFirst:be,sellLater:sl,totalRev:fr+lr,profit:fr+lr-b.totalCost,firstRev:fr,laterRev:lr};
}

function simulateHoldCF(b,hp){
  const be=b.breakEven,gpa=GROSS_AREA/TOTAL_APTS,mc=b.constr/BUILD_MONTHS;
  const au1=b.avgUnitRev,au2=gpa*hp+b.parkRev/TOTAL_APTS;
  const d1=au1*b.depPct,d2=au2*b.depPct,a141=au1*b.a14Pct,a161=au1*b.a16Pct;
  const rows=[];let cum=0,sold=0;const pace=parseInt(els.pace.value),ss=parseInt(els.start.value);
  for(let m=0;m<=PM;m++){
    const out=(m===0?b.upfront:0)+(m<BUILD_MONTHS?mc:0);
    let ns=0;
    if(m>=ss&&sold<be)ns=Math.min(pace,be-sold);
    else if(m>=28&&sold<TOTAL_APTS)ns=Math.min(Math.ceil((TOTAL_APTS-be)/3),TOTAL_APTS-sold);
    sold+=ns;const sD=Math.min(Math.round(Math.min(sold,be)*APTS_D/TOTAL_APTS),APTS_D),sE=Math.min(sold,be)-sD;
    let inf=sold<=be?ns*d1:ns*d2;
    if(m===12)inf+=sD*a141;if(m===18)inf+=sE*a141;if(m===24)inf+=sD*a161;
    if(m===30){inf+=sE*a161;if(sold>be)inf+=(sold-be)*(au2*0.80);}
    cum+=inf-out;rows.push({m,cum:Math.round(cum),sold});
  }
  return rows;
}

const canvas=document.getElementById('chart'),ctx=canvas.getContext('2d');
function drawChart(rows,hRows){
  const dpr=devicePixelRatio||1,rect=canvas.parentElement.getBoundingClientRect();
  const w=rect.width-32,h=rect.height-60;
  canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const all=[...rows.map(r=>r.cum),...hRows.map(r=>r.cum)];
  const mn=Math.min(...all,0),mx=Math.max(...all,1),rng=mx-mn||1;
  const px=m=>(m/PM)*(w-50)+30,py=v=>20+(1-(v-mn)/rng)*(h-44);
  const zY=py(0);
  ctx.strokeStyle='#243044';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(30,zY);ctx.lineTo(w-20,zY);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#475569';ctx.font='11px Heebo';ctx.textAlign='center';
  for(let m=0;m<=30;m+=3){ctx.fillText(m,px(m),h-2);}
  ctx.textAlign='right';ctx.fillText('0',26,zY+4);
  // Hold
  ctx.strokeStyle='#fbbf2470';ctx.lineWidth=2;ctx.beginPath();
  hRows.forEach((r,i)=>{i===0?ctx.moveTo(px(r.m),py(r.cum)):ctx.lineTo(px(r.m),py(r.cum));});ctx.stroke();
  // Base
  ctx.strokeStyle='#22d3ee';ctx.lineWidth=2.5;ctx.beginPath();
  rows.forEach((r,i)=>{i===0?ctx.moveTo(px(r.m),py(r.cum)):ctx.lineTo(px(r.m),py(r.cum));});ctx.stroke();
  // Peak
  const pk=rows.reduce((a,b)=>b.cum<a.cum?b:a);
  ctx.fillStyle='#f87171';ctx.beginPath();ctx.arc(px(pk.m),py(pk.cum),5,0,Math.PI*2);ctx.fill();
  ctx.font='bold 12px Heebo';ctx.textAlign='left';ctx.fillText(fmtM(pk.cum),px(pk.m)+10,py(pk.cum)-8);
}

    const d=await r.json();t.remove();
    if(d.choices?.[0]?.message?.content){const reply=d.choices[0].message.content;chatHistory.push({role:'assistant',content:reply});addMsg('ai',reply);}
    else if(d.error)addMsg('system','שגיאה: '+(d.error.message||''));
  }catch(e){t.remove();addMsg('system','שגיאת חיבור: '+e.message);}
  document.getElementById('chatSend').disabled=false;
}
</script>
</body>
</html>
